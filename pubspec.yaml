name: keyspace
description: KeySpace - pencatat nutrisi lokal, offline-first, dan chat-first.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.0.0
  dio: ^5.10.0
  drift: 2.34.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^20.0.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_timezone: ^5.0.1
  go_router: ^17.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  speech_to_text: ^7.4.0
  sqlite3: ^3.5.0
  timezone: ^0.10.1
  uuid: ^4.5.2
  google_fonts: ^8.2.0
  home_widget: ^0.7.0
  pdf: ^3.11.2
  printing: ^5.13.2

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: 2.34.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
